<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login – IntelliVerify</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0b1320;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: #162235;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border: 1px solid #23344e;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand i {
            font-size: 2.8rem;
            color: #0d6efd;
            margin-bottom: 10px;
        }

        .brand h2 {
            font-weight: 700;
            font-size: 1.6rem;
        }

        .brand p {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .error-alert {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid #dc3545;
            color: #ffb3bb;
            padding: 11px 13px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 18px;
            display: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #23344e;
            background: #0b1320;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13,110,253,0.12);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #0d6efd;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #0b5ed7;
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .footer-links {
            text-align: center;
            margin-top: 22px;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .footer-links a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 12px;
            color: #64748b;
            font-size: 0.8rem;
            text-decoration: none;
        }

        .back-home:hover {
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="brand">
        <i class="fas fa-shield-alt"></i>
        <h2>IntelliVerify Portal</h2>
        <p>Student & Academic Research Verification</p>
    </div>

    <div class="error-alert" id="errorAlert"></div>

    <form id="loginForm">

        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                required
                autocomplete="email"
                placeholder="user@university.edu"
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                required
                autocomplete="current-password"
                placeholder="••••••••"
            >
        </div>

        <button type="submit" class="btn-submit" id="loginBtn">
            <i class="fas fa-sign-in-alt"></i>
            <span>Sign In</span>
        </button>

    </form>

    <div class="footer-links">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Shared IntelliVerify Supabase configuration -->
<script src="../js/supabase-config.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {

    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const errorAlert = document.getElementById('errorAlert');

    loginForm.addEventListener('submit', async (e) => {

        e.preventDefault();

        errorAlert.style.display = 'none';
        errorAlert.textContent = '';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
            showError('Please enter your email and password.');
            return;
        }

        loginBtn.disabled = true;
        loginBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Signing in...';

        try {

            if (typeof window.loginUser !== 'function') {
                throw new Error(
                    'Login service is unavailable. Please check supabase-config.js.'
                );
            }

            /*
             * loginUser() should:
             * 1. Authenticate through Supabase Auth.
             * 2. Retrieve the user's profile/role.
             * 3. Return the profile object.
             */
            const profile = await window.loginUser(email, password);

            if (!profile || !profile.role) {
                throw new Error(
                    'Your account role could not be determined.'
                );
            }

            const role = profile.role.toLowerCase();

            /*
             * Student → Student Dashboard
             */
            if (role === 'student') {

                window.location.href = 'student/dashboard.html';

            /*
             * Supervisor/Admin → Admin Dashboard
             */
            } else if (
                role === 'supervisor' ||
                role === 'admin'
            ) {

                window.location.href = 'admin/dashboard.html';

            } else {

                throw new Error(
                    'Unrecognized user role: ' + profile.role
                );
            }

        } catch (err) {

            console.error('Login error:', err);

            showError(
                err?.message ||
                'Invalid login credentials. Please try again.'
            );

            loginBtn.disabled = false;

            loginBtn.innerHTML =
                '<i class="fas fa-sign-in-alt"></i> Sign In';
        }
    });

    function showError(message) {
        errorAlert.textContent = message;
        errorAlert.style.display = 'block';
    }

});
</script>

</body>
</html>
