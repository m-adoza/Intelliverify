<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - IntelliVerify</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b1120;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 24px;
      background-color: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar-brand {
      font-weight: 700;
      font-size: 1.125rem;
      color: #38bdf8;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      margin-top: 60px;
    }

    .card-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .card-subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.875rem;
      margin-bottom: 24px;
    }

    .alert {
      background-color: #7f1d1d;
      border: 1px solid #991b1b;
      color: #fecaca;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.875rem;
      margin-bottom: 20px;
      display: none;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #3b82f6;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .footer-link a {
      color: #38bdf8;
      text-decoration: none;
    }

    .footer-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="/" class="navbar-brand">🛡️ IntelliVerify</a>
  </div>

  <div class="card">
    <h1 class="card-title">Welcome Back</h1>
    <p class="card-subtitle">Sign in to your account</p>

    <div id="errorAlert" class="alert"></div>

    <!-- Explicit inline submit handler prevents standard page refresh -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Academic Email</label>
        <input type="email" id="email" placeholder="name@university.edu" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
    </form>

    <div class="footer-link">
      Don't have an account? <a href="/register.html">Register</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yxgxzflcgrzfndzxqibg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4Z3h6ZmxjZ3J6Zm5kenhxaWJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNDM5MDUsImV4cCI6MjEwNTgxOTkwNX0.DK159oguwZwpw31QoaEB0x0Rz4wTICJo6M5yrmVMwkM';

    async function handleLogin(e) {
      // 1. Immediately prevent page reloading
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const errorAlert = document.getElementById('errorAlert');
      errorAlert.style.display = 'none';

      // 2. Safeguard check for Supabase SDK
      if (typeof window.supabase === 'undefined') {
        errorAlert.textContent = 'Supabase SDK failed to load. Please refresh your browser.';
        errorAlert.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 3. Authenticate with Supabase Auth
        const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (authError) throw authError;

        const userId = authData.user.id;

        // 4. Fetch the user's assigned role from the database
        const { data: userData } = await supabase
          .from('users')
          .select('role')
          .eq('id', userId)
          .single();

        let userRole = userData?.role;

        // Fallback check on 'profiles' table if user is registered there
        if (!userRole) {
          const { data: profileData } = await supabase
            .from('profiles')
            .select('role')
            .eq('id', userId)
            .single();
          userRole = profileData?.role;
        }

        // Default role fallback
        if (!userRole) {
          userRole = 'student';
        }

        // 5. Redirect based on static routes
        if (userRole === 'admin') {
          window.location.href = '/admin/dashboard.html';
        } else {
          window.location.href = '/student/dashboard.html';
        }

      } catch (err) {
        errorAlert.textContent = err.message || 'Login failed. Please check your credentials.';
        errorAlert.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
