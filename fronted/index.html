<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntelliVerify — Academic Topic Approval & Plagiarism Platform</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
</head>
<body style="align-items: center; justify-content: center; padding: 20px;">

  <div class="card" style="width: 100%; max-width: 420px; padding: 36px;">
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="brand-icon" style="margin: 0 auto 16px auto; width: 44px; height: 44px; font-size: 1.2rem;">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 style="font-size: 1.25rem; font-weight: 600;">IntelliVerify Portal</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 6px;">Sign in to access your research management console</p>
    </div>

    <form id="auth-form">
      <div class="form-group">
        <label for="email">Academic Email</label>
        <input type="email" id="email" class="form-control" placeholder="name@university.edu" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 8px;">
        Sign In
      </button>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // Check existing session
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      if (session) {
        redirectByRole(session.user.id);
      }
    });

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit-btn');

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Authenticating...';

        const { data, error } = await window.supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;
        await redirectByRole(data.user.id);
      } catch (err) {
        window.showToast(err.message, 'danger');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    async function redirectByRole(userId) {
      try {
        const { data: profile, error } = await window.supabaseClient
          .from('profiles')
          .select('role')
          .eq('id', userId)
          .single();

        if (error || !profile) throw new Error("Profile authorization record missing");

        if (profile.role === 'student') window.location.href = '/student/dashboard';
        else if (profile.role === 'supervisor') window.location.href = '/supervisor/dashboard';
        else if (profile.role === 'admin') window.location.href = '/admin/dashboard';
      } catch (err) {
        window.showToast(err.message, 'danger');
      }
    }
  </script>
</body>
</html>
