<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntelliVerify - Academic Document Verification</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    
    .navbar {
      background-color: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar-brand { font-weight: 700; font-size: 1.2rem; color: #38bdf8; text-decoration: none; }
    .nav-links { display: flex; gap: 16px; align-items: center; }
    .nav-links a { color: #cbd5e1; text-decoration: none; font-size: 0.95rem; }
    .nav-links a:hover { color: #38bdf8; }
    
    .btn { padding: 8px 18px; border-radius: 6px; font-weight: 600; text-decoration: none; font-size: 0.9rem; }
    .btn-outline { border: 1px solid #38bdf8; color: #38bdf8; }
    .btn-primary { background-color: #2563eb; color: #fff; }

    .hero { text-align: center; max-width: 800px; margin: 100px auto 40px; padding: 0 20px; }
    .hero h1 { font-size: 2.8rem; font-weight: 800; margin-bottom: 16px; color: #f8fafc; }
    .hero p { font-size: 1.15rem; color: #94a3b8; margin-bottom: 32px; line-height: 1.6; }
    .hero-btns { display: flex; gap: 16px; justify-content: center; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="/index.html" class="navbar-brand">🛡️ IntelliVerify</a>
    <div class="nav-links" id="navActions">
      <a href="/login.html" class="btn btn-outline">Sign In</a>
      <a href="/register.html" class="btn btn-primary">Register</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Instant & Secure Academic Verification</h1>
    <p>Streamlining credential and matriculation verification for students and administrators through automated authentication.</p>
    <div class="hero-btns" id="heroActions">
      <a href="/login.html" class="btn btn-primary" style="padding: 12px 28px; font-size: 1rem;">Get Started</a>
      <a href="/register.html" class="btn btn-outline" style="padding: 12px 28px; font-size: 1rem;">Create Account</a>
    </div>
  </section>

  <script>
    const SUPABASE_URL = 'https://yxgxzflcgrzfndzxqibg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4Z3h6ZmxjZ3J6Zm5kenhxaWJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNDM5MDUsImV4cCI6MjEwNTgxOTkwNX0.DK159oguwZwpw31QoaEB0x0Rz4wTICJo6M5yrmVMwkM';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Dynamic Navigation: Show "Go to Dashboard" if user is already logged in
    async function checkExistingSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        const { data: userData } = await supabase
          .from('users')
          .select('role')
          .eq('id', session.user.id)
          .single();

        const dashPath = userData?.role === 'admin' ? '/admin/dashboard.html' : '/student/dashboard.html';

        document.getElementById('navActions').innerHTML = `
          <a href="${dashPath}" class="btn btn-primary">Go to Dashboard</a>
        `;
        document.getElementById('heroActions').innerHTML = `
          <a href="${dashPath}" class="btn btn-primary" style="padding: 12px 28px; font-size: 1rem;">Open Dashboard</a>
        `;
      }
    }

    checkExistingSession();
  </script>
</body>
</html>
