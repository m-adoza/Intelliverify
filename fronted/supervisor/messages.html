<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Supervisor Messages — IntelliVerify</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-chalkboard-user"></i></div>
      <div class="brand-title">Supervisor Console</div>
    </div>
    <nav class="nav-group">
      <a href="/supervisor/dashboard" class="nav-item"><i class="fa-solid fa-chart-line"></i> Topic Reviews</a>
      <a href="/supervisor/assigned-students" class="nav-item"><i class="fa-solid fa-users"></i> Assigned Students</a>
      <a href="/supervisor/messages" class="nav-item active"><i class="fa-solid fa-message"></i> Messages</a>
    </nav>
    <button onclick="window.supabaseClient.auth.signOut().then(() => window.location.href='/')" class="btn btn-secondary" style="width: 100%; margin-top: auto;">
      <i class="fa-solid fa-right-from-bracket"></i> Sign Out
    </button>
  </aside>

  <main class="main-content" style="display: flex; flex-direction: column; height: 100vh; padding-bottom: 36px;">
    <header class="top-bar">
      <div class="page-title">
        <h1>Student Discussions</h1>
        <p>Provide research guidance and topic feedback in real time</p>
      </div>
    </header>

    <div class="card" style="flex: 1; display: flex; flex-direction: column; padding: 0; overflow: hidden;">
      <div style="padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2);">
        <div style="display: flex; align-items: center; gap: 12px;">
          <i class="fa-solid fa-user-graduate" style="color: var(--primary);"></i>
          <h4 style="font-size: 0.95rem; font-weight: 600;">Student Communication Channel</h4>
        </div>
      </div>

      <div id="chat-messages" style="flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;">
        <div style="text-align: center; color: var(--text-dim); font-size: 0.85rem;">Select or load discussion stream...</div>
      </div>

      <form id="message-form" style="padding: 16px; border-top: 1px solid var(--border); display: flex; gap: 12px; background: rgba(0,0,0,0.2);">
        <input type="text" id="message-input" class="form-control" placeholder="Type supervisor instructions or feedback..." required autocomplete="off">
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Send Feedback</button>
      </form>
    </div>
  </main>

  <script>
    let currentUserId = null;

    document.addEventListener("DOMContentLoaded", async () => {
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      if (!session) return window.location.href = '/';
      currentUserId = session.user.id;

      await loadMessages();
      subscribeToRealtime();
    });

    async function loadMessages() {
      const chatContainer = document.getElementById('chat-messages');
      try {
        const { data: messages, error } = await window.supabaseClient
          .from('messages')
          .select('*')
          .order('created_at', { ascending: true });

        if (error) throw error;

        if (!messages || messages.length === 0) {
          chatContainer.innerHTML = '<div style="text-align: center; color: var(--text-dim); font-size: 0.85rem;">No student messages yet.</div>';
          return;
        }

        chatContainer.innerHTML = messages.map(msg => {
          const isMine = msg.sender_id === currentUserId;
          return `
            <div style="align-self: ${isMine ? 'flex-end' : 'flex-start'}; max-width: 70%;">
              <div style="padding: 10px 16px; border-radius: var(--radius-md); font-size: 0.875rem; background: ${isMine ? 'var(--primary)' : 'rgba(255,255,255,0.06)'}; color: var(--text-main); border: 1px solid ${isMine ? 'transparent' : 'var(--border)'};">
                ${msg.content}
              </div>
              <div style="font-size: 0.7rem; color: var(--text-dim); margin-top: 4px; text-align: ${isMine ? 'right' : 'left'};">
                ${new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
              </div>
            </div>
          `;
        }).join('');
        chatContainer.scrollTop = chatContainer.scrollHeight;
      } catch (err) {
        chatContainer.innerHTML = `<div style="color: var(--danger); text-align: center;">Error loading messages: ${err.message}</div>`;
      }
    }

    document.getElementById('message-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const content = input.value.trim();
      if (!content) return;

      try {
        const { error } = await window.supabaseClient
          .from('messages')
          .insert([{ sender_id: currentUserId, content }]);

        if (error) throw error;
        input.value = '';
      } catch (err) {
        window.showToast(err.message, 'danger');
      }
    });

    function subscribeToRealtime() {
      window.supabaseClient
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, () => loadMessages())
        .subscribe();
    }
  </script>
</body>
</html>
