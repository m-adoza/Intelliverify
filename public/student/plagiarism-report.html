<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plagiarism Scan — IntelliVerify</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/core.js"></script>

    <style>
        /* ---- Upload card ---- */
        .upload-zone {
            border: 2px dashed var(--iv-border-strong);
            border-radius: var(--iv-r-lg);
            padding: var(--iv-s-10) var(--iv-s-5);
            text-align: center;
            cursor: pointer;
            transition: var(--iv-transition);
            background: var(--iv-bg-subtle);
        }

        .upload-zone:hover,
        .upload-zone-drag {
            border-color: var(--iv-focus);
            background: var(--iv-info-bg);
        }

        .upload-zone-icon {
            width: 56px; height: 56px;
            border-radius: 50%;
            background: var(--iv-bg);
            border: 1px solid var(--iv-border);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            color: var(--iv-text-2);
            margin: 0 auto var(--iv-s-4);
        }

        .upload-zone-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--iv-text);
        }

        .upload-zone-sub {
            font-size: 13.5px;
            color: var(--iv-text-3);
            margin-top: 4px;
        }

        .upload-zone-formats {
            font-size: 12px;
            color: var(--iv-text-3);
            margin-top: var(--iv-s-4);
            display: flex; gap: 8px; justify-content: center;
            flex-wrap: wrap;
        }

        .upload-zone-formats span {
            padding: 3px 9px;
            border-radius: 999px;
            background: var(--iv-bg);
            border: 1px solid var(--iv-border);
            font-weight: 500;
        }

        input[type="file"] { display: none; }

        /* ---- File strip ---- */
        .file-strip {
            display: flex;
            align-items: center;
            gap: var(--iv-s-4);
            padding: var(--iv-s-4);
            background: var(--iv-info-bg);
            border: 1px solid var(--iv-info-border);
            border-radius: var(--iv-r-md);
            margin-top: var(--iv-s-4);
        }

        .file-strip-icon {
            width: 40px; height: 40px;
            border-radius: var(--iv-r-sm);
            background: var(--iv-bg);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            color: var(--iv-info);
            flex-shrink: 0;
        }

        .file-strip-body { flex: 1; min-width: 0; }

        .file-strip-name {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--iv-text);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .file-strip-meta {
            font-size: 12px;
            color: var(--iv-text-3);
            margin-top: 2px;
        }

        .file-strip-remove {
            background: transparent;
            border: none;
            color: var(--iv-text-3);
            font-size: 14px;
            cursor: pointer;
            padding: 6px;
            border-radius: var(--iv-r-sm);
        }

        .file-strip-remove:hover {
            background: rgba(0,0,0,0.05);
            color: var(--iv-danger);
        }

        /* ---- Scan bar ---- */
        .scan-bar {
            display: flex;
            gap: var(--iv-s-3);
            margin-top: var(--iv-s-5);
            flex-wrap: wrap;
        }

        /* ---- Progress ---- */
        .progress-wrap {
            margin-top: var(--iv-s-5);
            padding: var(--iv-s-5);
            background: var(--iv-bg-subtle);
            border: 1px solid var(--iv-border);
            border-radius: var(--iv-r-md);
        }

        .progress-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--iv-s-3);
            font-size: 13.5px;
        }

        .progress-head strong { color: var(--iv-text); font-weight: 600; }

        .progress-head span {
            color: var(--iv-text-3);
            font-family: var(--iv-font-mono);
            font-size: 12px;
        }

        .progress-track {
            height: 6px;
            background: var(--iv-bg-muted);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--iv-accent);
            border-radius: 3px;
            width: 0%;
            transition: width 0.4s ease;
        }

        .progress-steps {
            margin-top: var(--iv-s-3);
            font-size: 12px;
            color: var(--iv-text-3);
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .progress-steps span { display: inline-flex; align-items: center; gap: 5px; }
        .progress-steps .done { color: var(--iv-success); }
        .progress-steps .active { color: var(--iv-focus); font-weight: 600; }

        /* ---- Result card ---- */
        .result-card {
            margin-top: var(--iv-s-5);
            padding: var(--iv-s-6);
            background: var(--iv-bg);
            border: 1px solid var(--iv-border);
            border-radius: var(--iv-r-lg);
        }

        .result-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--iv-s-4);
            margin-bottom: var(--iv-s-5);
            flex-wrap: wrap;
        }

        .result-head-text {
            font-size: 13px;
            color: var(--iv-text-3);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 500;
        }

        /* ---- Tier headings ---- */
        .tier {
            margin-top: var(--iv-s-6);
            padding-top: var(--iv-s-5);
            border-top: 1px solid var(--iv-border);
        }

        .tier:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }

        .tier-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: var(--iv-s-4);
        }

        .tier-icon {
            width: 28px; height: 28px;
            border-radius: var(--iv-r-sm);
            background: var(--iv-bg-muted);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px;
            color: var(--iv-text-2);
            flex-shrink: 0;
        }

        .tier-icon-corpus  { background: var(--iv-info-bg);    color: var(--iv-info); }
        .tier-icon-ai      { background: #f5f3ff;              color: #7c3aed; }
        .tier-icon-web     { background: var(--iv-success-bg); color: var(--iv-success); }

        .tier-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--iv-text);
            letter-spacing: -0.01em;
        }

        .tier-sub {
            font-size: 12px;
            color: var(--iv-text-3);
            margin-top: 1px;
        }

        /* ---- Score circle (corpus) ---- */
        .score-grid {
            display: flex;
            align-items: center;
            gap: var(--iv-s-5);
            flex-wrap: wrap;
        }

        .score-circle {
            width: 110px; height: 110px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            font-family: var(--iv-font-mono);
            letter-spacing: -0.02em;
            flex-shrink: 0;
        }

        .score-circle.low    { background: var(--iv-success-bg); color: var(--iv-success); border: 2px solid var(--iv-success-border); }
        .score-circle.medium { background: var(--iv-warning-bg); color: var(--iv-warning); border: 2px solid var(--iv-warning-border); }
        .score-circle.high   { background: var(--iv-danger-bg);  color: var(--iv-danger);  border: 2px solid var(--iv-danger-border); }

        .score-meta { flex: 1; min-width: 180px; }

        .score-meta-title {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .score-meta-sub {
            font-size: 12.5px;
            color: var(--iv-text-3);
            margin-bottom: var(--iv-s-3);
        }

        .stat-row {
            display: flex;
            gap: var(--iv-s-5);
            flex-wrap: wrap;
            padding-top: var(--iv-s-3);
            border-top: 1px solid var(--iv-border);
        }

        .stat-label {
            font-size: 11px;
            color: var(--iv-text-3);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 500;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--iv-text);
            margin-top: 2px;
        }

        /* ---- Recommendation ---- */
        .rec {
            padding: var(--iv-s-4) var(--iv-s-5);
            border-radius: var(--iv-r-md);
            border-left: 3px solid var(--iv-info);
            background: var(--iv-info-bg);
            font-size: 13.5px;
            line-height: 1.55;
            color: var(--iv-text-2);
            margin-top: var(--iv-s-4);
        }

        .rec.rec-success { border-color: var(--iv-success); background: var(--iv-success-bg); }
        .rec.rec-warning { border-color: var(--iv-warning); background: var(--iv-warning-bg); }
        .rec.rec-danger  { border-color: var(--iv-danger);  background: var(--iv-danger-bg); }

        .rec strong {
            display: block;
            color: var(--iv-text);
            margin-bottom: 4px;
            font-weight: 600;
        }

        /* ---- Matches ---- */
        .match-list {
            display: flex;
            flex-direction: column;
            gap: var(--iv-s-2);
            margin-top: var(--iv-s-4);
        }

        .match {
            display: flex;
            align-items: flex-start;
            gap: var(--iv-s-3);
            padding: var(--iv-s-3) var(--iv-s-4);
            background: var(--iv-bg-subtle);
            border-radius: var(--iv-r-sm);
            border-left: 3px solid var(--iv-border-strong);
        }

        .match-warning { border-left-color: var(--iv-warning); }
        .match-danger  { border-left-color: var(--iv-danger); }
        .match-success { border-left-color: var(--iv-success); }

        .match-body { flex: 1; min-width: 0; }

        .match-title {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--iv-text);
            word-break: break-word;
        }

        .match-sub {
            font-size: 12px;
            color: var(--iv-text-3);
            margin-top: 3px;
            line-height: 1.5;
        }

        .match-phrases {
            font-size: 11.5px;
            color: var(--iv-text-3);
            margin-top: 4px;
            font-style: italic;
        }

        .match-score {
            font-family: var(--iv-font-mono);
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }

        /* ---- Keywords ---- */
        .kw-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: var(--iv-s-3);
        }

        .kw {
            padding: 4px 11px;
            border-radius: 999px;
            background: var(--iv-bg-muted);
            font-size: 12px;
            color: var(--iv-text-2);
            font-weight: 500;
        }

        /* ---- AI tier ---- */
        .ai-score-box {
            display: flex;
            align-items: center;
            gap: var(--iv-s-5);
            padding: var(--iv-s-5);
            background: #f5f3ff;
            border: 1px solid #ddd6fe;
            border-radius: var(--iv-r-md);
            flex-wrap: wrap;
        }

        .ai-score-circle {
            width: 90px; height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            font-family: var(--iv-font-mono);
            background: #ffffff;
            flex-shrink: 0;
        }

        .ai-score-circle.human  { color: var(--iv-success); border: 2px solid var(--iv-success-border); }
        .ai-score-circle.mixed  { color: var(--iv-warning); border: 2px solid var(--iv-warning-border); }
        .ai-score-circle.likely { color: var(--iv-danger);  border: 2px solid var(--iv-danger-border); }

        .ai-score-meta { flex: 1; min-width: 180px; }

        .ai-score-title {
            font-size: 15px;
            font-weight: 700;
            color: #5b21b6;
            margin-bottom: 3px;
        }

        .ai-score-sub {
            font-size: 12.5px;
            color: #6d28d9;
            line-height: 1.5;
        }

        .ai-indicators {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--iv-s-3);
            margin-top: var(--iv-s-4);
        }

        .ai-ind {
            padding: var(--iv-s-3);
            background: var(--iv-bg-subtle);
            border: 1px solid var(--iv-border);
            border-radius: var(--iv-r-sm);
        }

        .ai-ind-label {
            font-size: 11px;
            color: var(--iv-text-3);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 500;
        }

        .ai-ind-value {
            font-size: 16px;
            font-weight: 700;
            font-family: var(--iv-font-mono);
            color: var(--iv-text);
            margin-top: 4px;
        }

        .ai-ind-note {
            font-size: 11px;
            color: var(--iv-text-3);
            margin-top: 3px;
        }

        /* ---- External tier ---- */
        .ext-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-left: auto;
        }

        .ext-status-completed { background: var(--iv-success-bg); color: var(--iv-success); }
        .ext-status-partial   { background: var(--iv-warning-bg); color: var(--iv-warning); }
        .ext-status-failed    { background: var(--iv-danger-bg);  color: var(--iv-danger); }
        .ext-status-not_started { background: var(--iv-bg-muted); color: var(--iv-text-3); }

        .ext-sources {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: var(--iv-s-3);
            margin-bottom: var(--iv-s-4);
        }

        .ext-source-chip {
            font-size: 11.5px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 999px;
            background: var(--iv-bg-muted);
            color: var(--iv-text-2);
        }

        .ext-source-chip strong { color: var(--iv-text); margin-left: 4px; }

        .ext-match {
            display: flex;
            align-items: flex-start;
            gap: var(--iv-s-3);
            padding: var(--iv-s-3) var(--iv-s-4);
            background: var(--iv-bg-subtle);
            border: 1px solid var(--iv-border);
            border-radius: var(--iv-r-sm);
            margin-bottom: var(--iv-s-2);
            transition: var(--iv-transition);
        }

        .ext-match:hover {
            border-color: var(--iv-border-strong);
            background: var(--iv-bg);
        }

        .ext-match-source {
            width: 40px; height: 40px;
            border-radius: var(--iv-r-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700;
            flex-shrink: 0;
        }

        .ext-match-source-openalex {
            background: #eef2ff;
            color: #4f46e5;
        }

        .ext-match-source-wikipedia {
            background: #f4f4f5;
            color: #18181b;
        }

        .ext-match-body { flex: 1; min-width: 0; }

        .ext-match-title {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--iv-text);
            word-break: break-word;
        }

        .ext-match-meta {
            font-size: 11.5px;
            color: var(--iv-text-3);
            margin-top: 3px;
        }

        .ext-match-snippet {
            font-size: 12px;
            color: var(--iv-text-2);
            margin-top: 6px;
            line-height: 1.5;
            font-style: italic;
        }

        .ext-match-link {
            font-size: 12px;
            color: var(--iv-focus);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
        }

        .ext-match-link:hover { text-decoration: underline; }

        .ext-empty {
            padding: var(--iv-s-6) var(--iv-s-4);
            text-align: center;
            background: var(--iv-bg-subtle);
            border-radius: var(--iv-r-sm);
            font-size: 13px;
            color: var(--iv-text-3);
        }

        /* ---- Scan history ---- */
        .scan-list {
            background: var(--iv-bg);
            border: 1px solid var(--iv-border);
            border-radius: var(--iv-r-lg);
            overflow: hidden;
        }

        .scan-row {
            display: flex;
            align-items: center;
            gap: var(--iv-s-4);
            padding: var(--iv-s-4) var(--iv-s-5);
            border-bottom: 1px solid var(--iv-border);
        }

        .scan-row:last-child { border-bottom: none; }

        .scan-row-icon {
            width: 34px; height: 34px;
            border-radius: var(--iv-r-sm);
            background: var(--iv-bg-muted);
            display: flex; align-items: center; justify-content: center;
            color: var(--iv-text-2);
            font-size: 13px;
            flex-shrink: 0;
        }

        .scan-row-body { flex: 1; min-width: 0; }

        .scan-row-name {
            font-size: 13.5px;
            font-weight: 500;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .scan-row-meta {
            font-size: 12px;
            color: var(--iv-text-3);
            margin-top: 2px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .scan-row-score {
            font-family: var(--iv-font-mono);
            font-size: 13.5px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .scan-row-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .scan-row-btn {
            width: 32px; height: 32px;
            border-radius: var(--iv-r-sm);
            background: transparent;
            border: 1px solid var(--iv-border);
            color: var(--iv-text-2);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px;
            transition: var(--iv-transition);
        }

        .scan-row-btn:hover { background: var(--iv-bg-muted); }

        .mini-empty {
            padding: var(--iv-s-8) var(--iv-s-5);
            text-align: center;
            color: var(--iv-text-3);
            font-size: 13px;
            background: var(--iv-bg);
            border: 1px solid var(--iv-border);
            border-radius: var(--iv-r-lg);
        }

        .mini-empty i { font-size: 24px; opacity: 0.4; display: block; margin-bottom: var(--iv-s-2); }

        /* ---- Mobile ---- */
        @media (max-width: 600px) {
            .score-grid { gap: var(--iv-s-4); }
            .score-circle { width: 92px; height: 92px; font-size: 24px; }
            .ai-score-circle { width: 76px; height: 76px; font-size: 18px; }
            .result-card { padding: var(--iv-s-4); }
            .scan-row { padding: var(--iv-s-3) var(--iv-s-4); }
            .ai-indicators { grid-template-columns: 1fr; gap: var(--iv-s-2); }
        }
    </style>
</head>
<body>

<div id="iv-shell"></div>

<script>
    let state = {
        file: null,
        scanning: false,
        lastReport: null,
        history: []
    };

    (async () => {
        const ctx = await window.requireRole('student');
        if (!ctx) return;

        const content = await window.renderShell({
            ctx,
            activePath: '/student/plagiarism-report.html',
            title: 'Plagiarism Scan',
            subtitle: 'Three-tier check: corpus, AI-content signal, and external sources',
            actions: `
                <a href="/student/submit-topic.html" class="iv-btn iv-btn-secondary iv-btn-sm">
                    <i class="fas fa-paper-plane"></i> Submit topic
                </a>
            `
        });

        content.innerHTML = page();
        wireUpload();
        loadHistory();
    })();

    // ============================================================
    // MAIN LAYOUT
    // ============================================================

    function page() {
        return `
            <div class="iv-card iv-mb-6">
                <div class="iv-card-header">
                    <div>
                        <div class="iv-card-title">Upload a document</div>
                        <div class="iv-card-subtitle">
                            Your file is checked against your supervisor's corpus, external academic sources, and analyzed for AI-content signals.
                        </div>
                    </div>
                </div>

                <div class="upload-zone" id="uploadZone">
                    <div class="upload-zone-icon"><i class="fas fa-cloud-arrow-up"></i></div>
                    <div class="upload-zone-title">Drop your document here</div>
                    <div class="upload-zone-sub">or tap to browse</div>
                    <div class="upload-zone-formats">
                        <span>PDF</span>
                        <span>DOCX</span>
                        <span>TXT</span>
                    </div>
                    <input type="file" id="fileInput" accept=".pdf,.docx,.txt" />
                </div>

                <div id="fileStrip"></div>

                <div class="scan-bar" id="scanBar" style="display: none;">
                    <button class="iv-btn iv-btn-primary" id="scanBtn">
                        <i class="fas fa-microchip"></i>
                        <span>Run full scan</span>
                    </button>
                    <button class="iv-btn iv-btn-secondary" id="clearBtn">
                        <i class="fas fa-times"></i> Clear
                    </button>
                </div>

                <div id="progressArea"></div>
                <div id="resultArea"></div>
            </div>

            <div class="iv-row-between iv-mb-4">
                <div class="iv-card-title">Scan history</div>
                <button class="iv-btn iv-btn-ghost iv-btn-sm" id="refreshHistory">
                    <i class="fas fa-rotate-right"></i> Refresh
                </button>
            </div>
            <div id="historyArea"></div>
        `;
    }

    // ============================================================
    // UPLOAD
    // ============================================================

    function wireUpload() {
        const zone = document.getElementById('uploadZone');
        const input = document.getElementById('fileInput');

        zone.addEventListener('click', () => input.click());
        input.addEventListener('change', (e) => {
            if (e.target.files[0]) selectFile(e.target.files[0]);
        });

        ['dragenter', 'dragover'].forEach(evt =>
            zone.addEventListener(evt, (e) => {
                e.preventDefault();
                zone.classList.add('upload-zone-drag');
            })
        );

        ['dragleave', 'drop'].forEach(evt =>
            zone.addEventListener(evt, (e) => {
                e.preventDefault();
                zone.classList.remove('upload-zone-drag');
            })
        );

        zone.addEventListener('drop', (e) => {
            const f = e.dataTransfer.files[0];
            if (f) selectFile(f);
        });

        document.getElementById('scanBtn').onclick = runScan;
        document.getElementById('clearBtn').onclick = clearSelection;
        document.getElementById('refreshHistory').onclick = loadHistory;
    }

    const MAX_SIZE = 7 * 1024 * 1024;
    const ALLOWED = ['pdf', 'docx', 'txt'];

    function selectFile(file) {
        const ext = (file.name.split('.').pop() || '').toLowerCase();
        if (!ALLOWED.includes(ext)) {
            window.toast('Only PDF, DOCX, and TXT files are supported.', 'error');
            return;
        }
        if (file.size > MAX_SIZE) {
            window.toast('File is too large. Maximum size is 7 MB.', 'error');
            return;
        }
        state.file = file;
        renderFileStrip();
    }

    function renderFileStrip() {
        const wrap = document.getElementById('fileStrip');
        const bar = document.getElementById('scanBar');

        if (!state.file) {
            wrap.innerHTML = '';
            bar.style.display = 'none';
            return;
        }

        const f = state.file;
        const kb = (f.size / 1024).toFixed(1);
        const ext = (f.name.split('.').pop() || '').toUpperCase();

        wrap.innerHTML = `
            <div class="file-strip">
                <div class="file-strip-icon"><i class="fas ${fileIcon(ext.toLowerCase())}"></i></div>
                <div class="file-strip-body">
                    <div class="file-strip-name">${window.escapeHTML(f.name)}</div>
                    <div class="file-strip-meta">${kb} KB · ${ext}</div>
                </div>
                <button class="file-strip-remove" id="removeFile" aria-label="Remove">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        `;

        document.getElementById('removeFile').onclick = clearSelection;
        bar.style.display = 'flex';
    }

    function clearSelection() {
        state.file = null;
        state.lastReport = null;
        document.getElementById('fileInput').value = '';
        renderFileStrip();
        document.getElementById('progressArea').innerHTML = '';
        document.getElementById('resultArea').innerHTML = '';
    }

    function fileIcon(ext) {
        if (ext === 'pdf')  return 'fa-file-pdf';
        if (ext === 'docx') return 'fa-file-word';
        if (ext === 'txt')  return 'fa-file-lines';
        return 'fa-file';
    }

    // ============================================================
    // SCAN
    // ============================================================

    async function runScan() {
        if (!state.file || state.scanning) return;

        state.scanning = true;
        const scanBtn = document.getElementById('scanBtn');
        scanBtn.disabled = true;
        scanBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>Scanning…</span>`;
        document.getElementById('resultArea').innerHTML = '';

        const progress = startProgress();
        try {
            const base64 = await fileToBase64(state.file);
            progress.step(1, 'Uploading and extracting text…');

            const res = await window.api('/api/reports/scan', {
                method: 'POST',
                body: {
                    filename: state.file.name,
                    mime: state.file.type || guessMime(state.file.name),
                    base64
                }
            });

            progress.step(2, 'Running corpus similarity…');
            await wait(300);
            progress.step(3, 'Analyzing AI-content signals…');
            await wait(300);
            progress.step(4, 'Searching external academic sources…');
            await wait(300);
            progress.done();

            state.lastReport = res.report;
            document.getElementById('resultArea').innerHTML = renderResult(res.report);
            wireResultActions();

            window.toast('Scan completed.', 'success');

            state.file = null;
            document.getElementById('fileInput').value = '';
            renderFileStrip();

            loadHistory();

        } catch (err) {
            progress.hide();
            console.error(err);
            document.getElementById('resultArea').innerHTML = errorCard(err.message);
            window.toast(err.message || 'Scan failed.', 'error');
        } finally {
            state.scanning = false;
            scanBtn.disabled = false;
            scanBtn.innerHTML = `<i class="fas fa-microchip"></i> <span>Run full scan</span>`;
        }
    }

    // ============================================================
    // PROGRESS
    // ============================================================

    function startProgress() {
        const area = document.getElementById('progressArea');
        area.innerHTML = `
            <div class="progress-wrap">
                <div class="progress-head">
                    <strong>Analyzing document…</strong>
                    <span id="progressPct">0%</span>
                </div>
                <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-steps" id="progressSteps">
                    <span data-step="1"><i class="fas fa-circle"></i> Extract text</span>
                    <span data-step="2"><i class="fas fa-circle"></i> Corpus comparison</span>
                    <span data-step="3"><i class="fas fa-circle"></i> AI signal analysis</span>
                    <span data-step="4"><i class="fas fa-circle"></i> External sources</span>
                </div>
            </div>
        `;
        const fill = document.getElementById('progressFill');
        const pct = document.getElementById('progressPct');

        return {
            step(n, label) {
                const widths = { 1: 25, 2: 55, 3: 80, 4: 95 };
                fill.style.width = (widths[n] || 0) + '%';
                pct.textContent = (widths[n] || 0) + '%';
                const head = area.querySelector('.progress-head strong');
                if (head && label) head.textContent = label;
                const steps = area.querySelectorAll('.progress-steps span');
                steps.forEach(s => {
                    const idx = Number(s.dataset.step);
                    s.classList.remove('done', 'active');
                    if (idx < n) s.classList.add('done');
                    else if (idx === n) s.classList.add('active');
                });
            },
            done() {
                fill.style.width = '100%';
                pct.textContent = '100%';
                const steps = area.querySelectorAll('.progress-steps span');
                steps.forEach(s => { s.classList.remove('active'); s.classList.add('done'); });
            },
            hide() { area.innerHTML = ''; }
        };
    }

    // ============================================================
    // RESULT
    // ============================================================

    function renderResult(report) {
        return `
            <div class="result-card">
                <div class="result-head">
                    <div class="result-head-text">Scan result</div>
                    ${riskBadge(report.risk_level)}
                </div>

                ${renderCorpusTier(report)}
                ${renderAITier(report)}
                ${renderExternalTier(report)}

                <div class="scan-bar" style="margin-top: var(--iv-s-6); padding-top: var(--iv-s-5); border-top: 1px solid var(--iv-border);">
                    ${Number(report.similarity_score) <= 30 ? `
                        <button class="iv-btn iv-btn-primary" id="attachBtn">
                            <i class="fas fa-paper-plane"></i>
                            Attach to topic
                        </button>
                    ` : `
                        <button class="iv-btn iv-btn-secondary" disabled title="Similarity must be 30% or below to attach">
                            <i class="fas fa-lock"></i>
                            Cannot attach (&gt;30%)
                        </button>
                    `}
                    <button class="iv-btn iv-btn-secondary" id="againBtn">
                        <i class="fas fa-redo"></i> Scan another
                    </button>
                </div>
            </div>
        `;
    }

    // -------- Tier 1: Corpus --------

    function renderCorpusTier(report) {
        const score = Number(report.similarity_score || 0);
        const risk = (report.risk_level || 'low').toLowerCase();
        const stats = report.statistics || {};
        const matches = Array.isArray(report.matches) ? report.matches : [];
        const keywords = Array.isArray(report.keywords) ? report.keywords : [];

        const recClass =
            risk === 'high'   ? 'rec-danger'  :
            risk === 'medium' ? 'rec-warning' :
                                'rec-success';

        return `
            <div class="tier">
                <div class="tier-head">
                    <div class="tier-icon tier-icon-corpus"><i class="fas fa-database"></i></div>
                    <div style="flex: 1;">
                        <div class="tier-title">Corpus similarity</div>
                        <div class="tier-sub">Compared against supervisor-uploaded reference documents</div>
                    </div>
                </div>

                <div class="score-grid">
                    <div class="score-circle ${risk}">${score}%</div>
                    <div class="score-meta">
                        <div class="score-meta-title">${window.escapeHTML(report.filename || 'Document')}</div>
                        <div class="score-meta-sub">
                            ${window.escapeHTML((report.file_format || '').toUpperCase())}
                            · ${window.formatDateTime(report.created_at)}
                        </div>
                        <div class="stat-row">
                            <div>
                                <div class="stat-label">Words</div>
                                <div class="stat-value">${stats.words || 0}</div>
                            </div>
                            <div>
                                <div class="stat-label">Docs compared</div>
                                <div class="stat-value">${stats.matches_checked || 0}</div>
                            </div>
                            <div>
                                <div class="stat-label">Shared phrases</div>
                                <div class="stat-value">${stats.phrases_matched || 0}</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="rec ${recClass}">
                    <strong><i class="fas fa-lightbulb"></i> Recommendation</strong>
                    ${window.escapeHTML(report.recommendation || '—')}
                </div>

                ${matches.length ? `
                    <div class="match-list">
                        ${matches.map(m => {
                            const s = Number(m.similarity || 0);
                            const cls = s >= 60 ? 'match-danger' : s >= 30 ? 'match-warning' : 'match-success';
                            const color = s >= 60 ? 'var(--iv-danger)' : s >= 30 ? 'var(--iv-warning)' : 'var(--iv-success)';
                            return `
                                <div class="match ${cls}">
                                    <div class="match-body">
                                        <div class="match-title">${window.escapeHTML(m.title || 'Reference document')}</div>
                                        ${Array.isArray(m.phrases) && m.phrases.length ? `
                                            <div class="match-phrases">
                                                Shared: ${m.phrases.slice(0, 3).map(p => `"${window.escapeHTML(p)}"`).join(', ')}
                                            </div>
                                        ` : ''}
                                    </div>
                                    <div class="match-score" style="color: ${color};">${s}%</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                ` : ''}

                ${keywords.length ? `
                    <div class="kw-wrap">
                        ${keywords.map(k => `<span class="kw">${window.escapeHTML(k)}</span>`).join('')}
                    </div>
                ` : ''}
            </div>
        `;
    }

    // -------- Tier 2: AI --------

    function renderAITier(report) {
        const aiScore = Number(report.ai_likelihood_score || 0);
        const indicators = report.ai_indicators || {};

        // Classify
        let band, bandClass, title, sub;
        if (aiScore < 40) {
            band = 'Likely human-written';
            bandClass = 'human';
            title = 'Likely human-written';
            sub = 'Sentence variety and vocabulary distribution are consistent with human authorship.';
        } else if (aiScore < 70) {
            band = 'Mixed signals';
            bandClass = 'mixed';
            title = 'Mixed signals';
            sub = 'Some patterns resemble AI-generated text, but the result is inconclusive. Consider reviewing sentence structure variety.';
        } else {
            band = 'Likely AI-generated';
            bandClass = 'likely';
            title = 'Likely AI-generated';
            sub = 'Statistical patterns strongly resemble machine-generated text. Consider rewriting to add more sentence-length variety and personal voice.';
        }

        // Indicator formatting
        const burst = indicators.burstiness;
        const uniform = indicators.sentence_uniformity;
        const opener = indicators.opener_repetition;
        const sentCount = indicators.sentence_count;
        const avgLen = indicators.average_sentence_length;

        return `
            <div class="tier">
                <div class="tier-head">
                    <div class="tier-icon tier-icon-ai"><i class="fas fa-robot"></i></div>
                    <div style="flex: 1;">
                        <div class="tier-title">AI-content signal</div>
                        <div class="tier-sub">Statistical heuristic — not a definitive verdict</div>
                    </div>
                    <span class="ext-status ${aiScore < 40 ? 'ext-status-completed' : aiScore < 70 ? 'ext-status-partial' : 'ext-status-failed'}">
                        ${window.escapeHTML(band)}
                    </span>
                </div>

                <div class="ai-score-box">
                    <div class="ai-score-circle ${bandClass}">${aiScore}%</div>
                    <div class="ai-score-meta">
                        <div class="ai-score-title">${window.escapeHTML(title)}</div>
                        <div class="ai-score-sub">${window.escapeHTML(sub)}</div>
                    </div>
                </div>

                ${sentCount ? `
                    <div class="ai-indicators">
                        <div class="ai-ind">
                            <div class="ai-ind-label">Burstiness</div>
                            <div class="ai-ind-value">${burst !== undefined ? burst : '—'}</div>
                            <div class="ai-ind-note">Higher = more human</div>
                        </div>
                        <div class="ai-ind">
                            <div class="ai-ind-label">Uniformity</div>
                            <div class="ai-ind-value">${uniform !== undefined ? uniform : '—'}</div>
                            <div class="ai-ind-note">Lower = more human</div>
                        </div>
                        <div class="ai-ind">
                            <div class="ai-ind-label">Opener repeat</div>
                            <div class="ai-ind-value">${opener !== undefined ? opener : '—'}</div>
                            <div class="ai-ind-note">Lower = more human</div>
                        </div>
                    </div>
                    <div style="margin-top: var(--iv-s-3); font-size: 12px; color: var(--iv-text-3); line-height: 1.55;">
                        Analyzed ${sentCount} sentences · average ${avgLen || 0} words per sentence.
                        AI models tend to produce uniform sentence lengths and reuse similar openers.
                    </div>
                ` : ''}
            </div>
        `;
    }

    // -------- Tier 3: External --------

    function renderExternalTier(report) {
        const matches = Array.isArray(report.external_matches) ? report.external_matches : [];
        const sources = report.external_sources_checked || {};
        const status = report.external_scan_status || 'not_started';

        // Group matches by source
        const bySource = {};
        matches.forEach(m => {
            const s = m.source || 'Unknown';
            if (!bySource[s]) bySource[s] = [];
            bySource[s].push(m);
        });

        const sourceChips = Object.keys(sources).length
            ? Object.entries(sources).map(([name, count]) =>
                `<span class="ext-source-chip">${window.escapeHTML(name)}<strong>${count}</strong></span>`
              ).join('')
            : '<span class="ext-source-chip">No sources queried</span>';

        // Status label
        const statusLabel =
            status === 'completed' ? 'Completed' :
            status === 'partial'   ? 'Partial'   :
            status === 'failed'    ? 'Failed'    : 'Not started';

        return `
            <div class="tier">
                <div class="tier-head">
                    <div class="tier-icon tier-icon-web"><i class="fas fa-globe"></i></div>
                    <div style="flex: 1;">
                        <div class="tier-title">External source matches</div>
                        <div class="tier-sub">Academic papers (OpenAlex) and reference material (Wikipedia)</div>
                    </div>
                    <span class="ext-status ext-status-${status}">
                        ${window.escapeHTML(statusLabel)}
                    </span>
                </div>

                <div class="ext-sources">
                    ${sourceChips}
                </div>

                ${matches.length ? `
                    ${matches.map(m => externalMatchRow(m)).join('')}
                ` : `
                    <div class="ext-empty">
                        <i class="fas fa-magnifying-glass" style="font-size: 20px; opacity: 0.4; display: block; margin-bottom: 8px;"></i>
                        ${status === 'failed'
                            ? 'External sources could not be reached this time. Your corpus similarity and AI signal are still valid.'
                            : 'No matching external sources found for this document\'s key terms.'}
                    </div>
                `}
            </div>
        `;
    }

    function externalMatchRow(m) {
        const source = m.source || 'Unknown';
        const sourceKey = source.toLowerCase();
        const initial = source[0];

        const meta = [];
        if (m.year) meta.push(m.year);
        if (Array.isArray(m.authors) && m.authors.length) {
            meta.push(m.authors.slice(0, 3).join(', '));
        }
        if (m.type) meta.push(m.type);

        return `
            <div class="ext-match">
                <div class="ext-match-source ext-match-source-${sourceKey}">
                    ${window.escapeHTML(initial)}
                </div>
                <div class="ext-match-body">
                    <div class="ext-match-title">${window.escapeHTML(m.title || 'Untitled')}</div>
                    ${meta.length ? `<div class="ext-match-meta">${window.escapeHTML(meta.join(' · '))}</div>` : ''}
                    ${m.snippet ? `<div class="ext-match-snippet">"${window.escapeHTML(m.snippet)}"</div>` : ''}
                    ${m.url ? `
                        <a class="ext-match-link" href="${window.escapeHTML(m.url)}" target="_blank" rel="noopener">
                            <i class="fas fa-arrow-up-right-from-square"></i> View source
                        </a>
                    ` : ''}
                </div>
            </div>
        `;
    }

    // ============================================================
    // HELPERS
    // ============================================================

    function riskBadge(risk) {
        const r = String(risk || 'low').toLowerCase();
        return `<span class="iv-badge iv-badge-${r}">${window.escapeHTML(r)} risk</span>`;
    }

    function wireResultActions() {
        const attach = document.getElementById('attachBtn');
        if (attach) {
            attach.onclick = () => {
                if (!state.lastReport) return;
                window.location.href =
                    '/student/submit-topic.html?report_id=' +
                    encodeURIComponent(state.lastReport.report_id);
            };
        }

        const again = document.getElementById('againBtn');
        if (again) again.onclick = () => {
            document.getElementById('uploadZone').scrollIntoView({ behavior: 'smooth' });
            document.getElementById('fileInput').click();
        };
    }

    function errorCard(message) {
        return `
            <div class="result-card" style="border-color: var(--iv-danger-border); background: var(--iv-danger-bg);">
                <div class="tier-head" style="margin-bottom: 0;">
                    <div class="tier-icon" style="background: #fff; color: var(--iv-danger);">
                        <i class="fas fa-triangle-exclamation"></i>
                    </div>
                    <div style="flex: 1;">
                        <div class="tier-title" style="color: var(--iv-danger);">Scan failed</div>
                        <div class="tier-sub" style="color: var(--iv-text-2);">
                            ${window.escapeHTML(message || 'Something went wrong. Please try again.')}
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    // ============================================================
    // HISTORY
    // ============================================================

    async function loadHistory() {
        const area = document.getElementById('historyArea');
        area.innerHTML = `<div class="iv-loading"><i class="fas fa-spinner fa-spin"></i></div>`;
        try {
            const res = await window.api('/api/reports');
            const reports = res.reports || [];
            area.innerHTML = reports.length ? historyList(reports) : historyEmpty();
            wireHistoryActions(reports);
        } catch (err) {
            console.error(err);
            area.innerHTML = `<div class="mini-empty"><i class="fas fa-triangle-exclamation"></i>Could not load scan history.</div>`;
        }
    }

    function historyList(reports) {
        return `
            <div class="scan-list">
                ${reports.map(r => {
                    const score = Number(r.similarity_score || 0);
                    const risk = (r.risk_level || 'low').toLowerCase();
                    const color =
                        risk === 'high'   ? 'var(--iv-danger)'  :
                        risk === 'medium' ? 'var(--iv-warning)' :
                                            'var(--iv-success)';
                    const ext = (r.file_format || '').toLowerCase();
                    const ai = Number(r.ai_likelihood_score || 0);
                    const extStatus = r.external_scan_status || 'not_started';

                    return `
                        <div class="scan-row">
                            <div class="scan-row-icon"><i class="fas ${fileIcon(ext)}"></i></div>
                            <div class="scan-row-body">
                                <div class="scan-row-name">${window.escapeHTML(r.filename || 'Document')}</div>
                                <div class="scan-row-meta">
                                    <span>${window.escapeHTML((r.file_format || '').toUpperCase())}</span>
                                    <span>·</span>
                                    <span>${window.formatDate(r.created_at)}</span>
                                    <span>·</span>
                                    <span style="display:inline-flex; align-items:center; gap:4px;">
                                        <i class="fas fa-robot" style="font-size:10px;"></i>
                                        AI ${ai}%
                                    </span>
                                    <span>·</span>
                                    <span style="display:inline-flex; align-items:center; gap:4px;">
                                        <i class="fas fa-globe" style="font-size:10px;"></i>
                                        ${window.escapeHTML(extStatus)}
                                    </span>
                                </div>
                            </div>
                            <div class="scan-row-score" style="color: ${color};">${score}%</div>
                            <div class="scan-row-actions">
                                <button class="scan-row-btn" data-action="download" data-id="${window.escapeHTML(r.report_id)}" title="Download original">
                                    <i class="fas fa-download"></i>
                                </button>
                                <button class="scan-row-btn" data-action="delete" data-id="${window.escapeHTML(r.report_id)}" title="Delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }

    function historyEmpty() {
        return `
            <div class="mini-empty">
                <i class="fas fa-file-shield"></i>
                No scans yet. Upload a document above to get started.
            </div>
        `;
    }

    function wireHistoryActions(reports) {
        document.querySelectorAll('[data-action="download"]').forEach(btn => {
            btn.onclick = async () => {
                const id = btn.dataset.id;
                try {
                    btn.disabled = true;
                    const res = await window.api('/api/reports/' + id + '/download');
                    window.open(res.url, '_blank');
                    window.toast('Download link opened.', 'success');
                } catch (err) {
                    window.toast(err.message || 'Download failed.', 'error');
                } finally {
                    btn.disabled = false;
                }
            };
        });

        document.querySelectorAll('[data-action="delete"]').forEach(btn => {
            btn.onclick = async () => {
                const id = btn.dataset.id;
                const ok = await window.confirmDialog({
                    title: 'Delete scan?',
                    message: 'This removes the scan and the stored file. This action cannot be undone.',
                    confirmLabel: 'Delete',
                    danger: true
                });
                if (!ok) return;
                try {
                    await window.api('/api/reports/' + id, { method: 'DELETE' });
                    window.toast('Scan deleted.', 'success');
                    loadHistory();
                } catch (err) {
                    window.toast(err.message || 'Delete failed.', 'error');
                }
            };
        });
    }

    // ============================================================
    // LOW-LEVEL HELPERS
    // ============================================================

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                const result = reader.result || '';
                const idx = result.indexOf(',');
                resolve(idx >= 0 ? result.slice(idx + 1) : result);
            };
            reader.onerror = () => reject(new Error('Could not read the file.'));
            reader.readAsDataURL(file);
        });
    }

    function guessMime(filename) {
        const ext = (filename.split('.').pop() || '').toLowerCase();
        if (ext === 'pdf')  return 'application/pdf';
        if (ext === 'docx') return 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
        if (ext === 'txt')  return 'text/plain';
        return 'application/octet-stream';
    }

    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
