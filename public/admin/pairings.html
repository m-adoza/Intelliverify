<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pairings — IntelliVerify Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/core.js"></script>

    <style>
        .info-banner {
            display: flex;
            align-items: flex-start;
            gap: var(--iv-s-4);
            padding: var(--iv-s-4) var(--iv-s-5);
            background: var(--iv-info-bg);
            border: 1px solid var(--iv-info-border);
            border-radius: var(--iv-r-md);
            margin-bottom: var(--iv-s-5);
        }

        .info-banner-icon {
            width: 32px; height: 32px;
            border-radius: var(--iv-r-sm);
            background: var(--iv-bg);
            display: flex; align-items: center; justify-content: center;
            color: var(--iv-info);
            font-size: 14px;
            flex-shrink: 0;
        }

        .info-banner-body { flex: 1; min-width: 0; }

        .info-banner-title {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--iv-text);
            margin-bottom: 3px;
        }

        .info-banner-text {
            font-size: 13px;
            color: var(--iv-text-2);
            line-height: 1.55;
        }

        .toolbar {
            display: flex;
            gap: var(--iv-s-3);
            margin-bottom: var(--iv-s-4);
            flex-wrap: wrap;
            align-items: center;
        }

        .search-wrap {
            position: relative;
            flex: 1;
            min-width: 220px;
            max-width: 400px;
        }

        .search-wrap i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--iv-text-3);
            font-size: 12px;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            height: 38px;
            padding: 0 14px 0 34px;
            border-radius: var(--iv-r-sm);
            border: 1px solid var(--iv-border-strong);
            background: var(--iv-bg);
            font-family: inherit;
            font-size: 13.5px;
            color: var(--iv-text);
            outline: none;
            transition: var(--iv-transition);
        }

        .search-input:focus {
            border-color: var(--iv-focus);
            box-shadow: 0 0 0 3px var(--iv-focus-ring);
        }

        /* Horizontal-scroll wrapper for narrow screens */
        .table-wrap {
            background: var(--iv-bg);
            border: 1px solid var(--iv-border);
            border-radius: var(--iv-r-lg);
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .table-wrap::-webkit-scrollbar {
            height: 6px;
        }

        .table-wrap::-webkit-scrollbar-thumb {
            background: var(--iv-border-strong);
            border-radius: 3px;
        }

        .table-wrap::-webkit-scrollbar-track {
            background: transparent;
        }

        .pairs-table {
            width: 100%;
            min-width: 720px;
            border-collapse: collapse;
            font-size: 13.5px;
        }

        .pairs-table th {
            text-align: left;
            padding: 12px var(--iv-s-5);
            background: var(--iv-bg-subtle);
            font-size: 12px;
            font-weight: 600;
            color: var(--iv-text-3);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 1px solid var(--iv-border);
            white-space: nowrap;
        }

        .pairs-table td {
            padding: 14px var(--iv-s-5);
            border-bottom: 1px solid var(--iv-border);
            color: var(--iv-text-2);
            vertical-align: middle;
        }

        .pairs-table tbody tr:last-child td { border-bottom: none; }
        .pairs-table tbody tr:hover td { background: var(--iv-bg-subtle); }

        .person-cell {
            display: flex;
            align-items: center;
            gap: var(--iv-s-3);
            min-width: 0;
        }

        .person-avatar {
            width: 34px; height: 34px;
            border-radius: 50%;
            background: var(--iv-bg-muted);
            color: var(--iv-text-2);
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 600;
            flex-shrink: 0;
        }

        .person-sup  { background: var(--iv-info-bg);    color: var(--iv-info); }
        .person-stu  { background: var(--iv-success-bg); color: var(--iv-success); }

        .person-body { min-width: 0; }

        .person-name {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--iv-text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .person-email {
            font-size: 12px;
            color: var(--iv-text-3);
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .source-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .source-badge-code {
            background: var(--iv-bg-muted);
            color: var(--iv-text-2);
            border-color: var(--iv-border);
        }

        .source-badge-admin {
            background: var(--iv-warning-bg);
            color: var(--iv-warning);
            border-color: var(--iv-warning-border);
        }

        .row-btn {
            width: 32px; height: 32px;
            border-radius: var(--iv-r-sm);
            background: transparent;
            border: 1px solid var(--iv-border);
            color: var(--iv-text-2);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 12.5px;
            transition: var(--iv-transition);
        }

        .row-btn:hover {
            background: var(--iv-bg-muted);
            color: var(--iv-text);
        }

        .row-btn-danger:hover {
            background: var(--iv-danger-bg);
            border-color: var(--iv-danger-border);
            color: var(--iv-danger);
        }

        .row-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .row-actions {
            display: flex;
            gap: 4px;
            justify-content: flex-end;
        }

        .empty {
            background: var(--iv-bg);
            border: 1px solid var(--iv-border);
            border-radius: var(--iv-r-lg);
            padding: var(--iv-s-10) var(--iv-s-5);
            text-align: center;
        }

        .empty-icon {
            width: 52px; height: 52px;
            border-radius: 50%;
            background: var(--iv-bg-muted);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            color: var(--iv-text-3);
            margin: 0 auto var(--iv-s-4);
        }

        .empty-title {
            font-size: 15px; font-weight: 600;
            color: var(--iv-text);
        }

        .empty-text {
            font-size: 13.5px;
            color: var(--iv-text-3);
            margin-top: 6px;
            max-width: 420px;
            margin-left: auto; margin-right: auto;
            line-height: 1.55;
        }

        .m-form .iv-form-group:last-of-type { margin-bottom: 0; }

        .m-note {
            font-size: 12.5px;
            color: var(--iv-text-3);
            line-height: 1.55;
            padding: var(--iv-s-3) var(--iv-s-4);
            background: var(--iv-bg-subtle);
            border: 1px solid var(--iv-border);
            border-radius: var(--iv-r-sm);
            margin-top: var(--iv-s-2);
        }

        @media (max-width: 700px) {
            .toolbar { flex-direction: column; align-items: stretch; }
            .search-wrap { max-width: none; }
            .pairs-table th, .pairs-table td { padding: 12px var(--iv-s-3); }
        }
    </style>
</head>
<body>

<div id="iv-shell"></div>

<script>
    const state = {
        pairings: [],
        users: [],
        searchTerm: '',
        busyIds: new Set()
    };

    (async () => {
        const ctx = await window.requireRole('admin');
        if (!ctx) return;

        const content = await window.renderShell({
            ctx,
            activePath: '/admin/pairings.html',
            title: 'Supervisor-Student Pairings',
            subtitle: 'Audit, create, and remove supervision links',
            actions: `
                <button class="iv-btn iv-btn-primary iv-btn-sm" id="createPairBtn">
                    <i class="fas fa-plus"></i> New pairing
                </button>
            `
        });

        content.innerHTML = page();
        wireToolbar();
        await load();
    })();

    function page() {
        return `
            <div class="info-banner">
                <div class="info-banner-icon"><i class="fas fa-circle-info"></i></div>
                <div class="info-banner-body">
                    <div class="info-banner-title">About pairings</div>
                    <div class="info-banner-text">
                        Normally, students share their pairing codes and supervisors redeem them.
                        As an admin, you can override this flow — manually assign a supervisor to a
                        student, remove existing links, or clean up incorrect pairs.
                    </div>
                </div>
            </div>

            <div class="toolbar">
                <div class="search-wrap">
                    <i class="fas fa-search"></i>
                    <input class="search-input" id="searchInput"
                           placeholder="Search by supervisor or student name/email…"
                           autocomplete="off" />
                </div>
            </div>

            <div id="tableArea">
                <div class="iv-loading"><i class="fas fa-spinner fa-spin"></i></div>
            </div>
        `;
    }

    function wireToolbar() {
        document.getElementById('searchInput').addEventListener('input', (e) => {
            state.searchTerm = e.target.value.trim().toLowerCase();
            renderTable();
        });

        document.getElementById('createPairBtn').onclick = openCreateModal;
    }

    async function load() {
        const area = document.getElementById('tableArea');
        try {
            const [pairRes, usersRes] = await Promise.all([
                window.api('/api/admin/pairings'),
                window.api('/api/admin/users')
            ]);

            state.pairings = pairRes.pairings || [];
            state.users = usersRes.users || [];

            renderTable();

        } catch (err) {
            console.error(err);
            area.innerHTML = errorState(err.message);
            const retry = document.getElementById('retryBtn');
            if (retry) retry.onclick = load;
        }
    }

    function renderTable() {
        const area = document.getElementById('tableArea');

        if (!state.pairings.length) {
            area.innerHTML = emptyState();
            return;
        }

        const filtered = state.pairings.filter(p => {
            if (!state.searchTerm) return true;
            const sup = p.supervisor || {};
            const stu = p.student || {};
            const hay = [
                sup.full_name, sup.email,
                stu.full_name, stu.email
            ].filter(Boolean).join(' ').toLowerCase();
            return hay.includes(state.searchTerm);
        });

        if (!filtered.length) {
            area.innerHTML = `
                <div class="empty">
                    <div class="empty-icon"><i class="fas fa-search"></i></div>
                    <div class="empty-title">No matches</div>
                    <div class="empty-text">
                        No pairings match "${window.escapeHTML(state.searchTerm)}".
                    </div>
                </div>
            `;
            return;
        }

        area.innerHTML = `
            <div class="table-wrap">
                <table class="pairs-table">
                    <thead>
                        <tr>
                            <th>Supervisor</th>
                            <th>Student</th>
                            <th>Source</th>
                            <th>Linked</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filtered.map(p => row(p)).join('')}
                    </tbody>
                </table>
            </div>
        `;

        wireRows();
    }

    function row(p) {
        const sup = p.supervisor || {};
        const stu = p.student || {};
        const isBusy = state.busyIds.has(p.id);

        const supName = sup.full_name || sup.email || 'Supervisor';
        const stuName = stu.full_name || stu.email || 'Student';

        const sourceClass =
            p.linked_by === 'admin' ? 'source-badge-admin' : 'source-badge-code';
        const sourceLabel =
            p.linked_by === 'admin' ? 'Admin' : 'Code';
        const sourceIcon =
            p.linked_by === 'admin' ? 'fa-user-shield' : 'fa-link';

        return `
            <tr data-pair-id="${window.escapeHTML(p.id)}">
                <td>
                    <div class="person-cell">
                        <div class="person-avatar person-sup">${window.escapeHTML(window.initials(supName))}</div>
                        <div class="person-body">
                            <div class="person-name">${window.escapeHTML(supName)}</div>
                            <div class="person-email">${window.escapeHTML(sup.email || '')}</div>
                        </div>
                    </div>
                </td>
                <td>
                    <div class="person-cell">
                        <div class="person-avatar person-stu">${window.escapeHTML(window.initials(stuName))}</div>
                        <div class="person-body">
                            <div class="person-name">${window.escapeHTML(stuName)}</div>
                            <div class="person-email">${window.escapeHTML(stu.email || '')}</div>
                        </div>
                    </div>
                </td>
                <td>
                    <span class="source-badge ${sourceClass}">
                        <i class="fas ${sourceIcon}"></i>
                        ${window.escapeHTML(sourceLabel)}
                    </span>
                </td>
                <td>${window.formatDate(p.linked_at)}</td>
                <td>
                    <div class="row-actions">
                        <button class="row-btn row-btn-danger"
                                data-action="unlink"
                                data-id="${window.escapeHTML(p.id)}"
                                data-sup="${window.escapeHTML(supName)}"
                                data-stu="${window.escapeHTML(stuName)}"
                                title="Unlink this pair"
                                ${isBusy ? 'disabled' : ''}>
                            <i class="fas fa-link-slash"></i>
                        </button>
                    </div>
                </td>
            </tr>
        `;
    }

    function wireRows() {
        document.querySelectorAll('[data-action="unlink"]').forEach(btn => {
            btn.onclick = async () => {
                const pairId = btn.dataset.id;
                const supName = btn.dataset.sup;
                const stuName = btn.dataset.stu;

                const ok = await window.confirmDialog({
                    title: 'Unlink this pair?',
                    message: `Remove the supervision link between ${supName} and ${stuName}. They can re-link later using a pairing code.`,
                    confirmLabel: 'Unlink',
                    danger: true
                });
                if (!ok) return;

                state.busyIds.add(pairId);
                btn.disabled = true;
                btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i>`;

                try {
                    await window.api('/api/admin/pairings/' + pairId, { method: 'DELETE' });
                    window.toast('Pairing removed.', 'success');
                    state.pairings = state.pairings.filter(p => p.id !== pairId);
                    renderTable();
                } catch (err) {
                    console.error(err);
                    window.toast(err.message || 'Could not unlink.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fas fa-link-slash"></i>`;
                } finally {
                    state.busyIds.delete(pairId);
                }
            };
        });
    }

    function emptyState() {
        return `
            <div class="empty">
                <div class="empty-icon"><i class="fas fa-link"></i></div>
                <div class="empty-title">No pairings yet</div>
                <div class="empty-text">
                    When supervisors redeem student pairing codes, links appear here.
                    You can also create one manually using the "New pairing" button.
                </div>
                <button class="iv-btn iv-btn-primary" style="margin-top: var(--iv-s-4);" onclick="openCreateModal()">
                    <i class="fas fa-plus"></i> Create pairing
                </button>
            </div>
        `;
    }

    function openCreateModal() {
        const supervisors = state.users.filter(u => u.role === 'supervisor');
        const students = state.users.filter(u => u.role === 'student');

        if (!supervisors.length) {
            window.toast('No supervisors registered yet. Promote a user first.', 'warning');
            return;
        }
        if (!students.length) {
            window.toast('No students registered yet.', 'warning');
            return;
        }

        const body = document.createElement('div');
        body.className = 'm-form';
        body.innerHTML = `
            <div class="iv-form-group">
                <label class="iv-label" for="modalSup">Supervisor</label>
                <select class="iv-select" id="modalSup">
                    <option value="">— Select a supervisor —</option>
                    ${supervisors.map(u => `
                        <option value="${window.escapeHTML(u.id)}">
                            ${window.escapeHTML((u.full_name || u.email) + (u.department ? ' · ' + u.department : ''))}
                        </option>
                    `).join('')}
                </select>
            </div>

            <div class="iv-form-group">
                <label class="iv-label" for="modalStu">Student</label>
                <select class="iv-select" id="modalStu">
                    <option value="">— Select a student —</option>
                    ${students.map(u => `
                        <option value="${window.escapeHTML(u.id)}">
                            ${window.escapeHTML((u.full_name || u.email) + (u.department ? ' · ' + u.department : ''))}
                        </option>
                    `).join('')}
                </select>
            </div>

            <div class="m-note">
                <i class="fas fa-circle-info"></i>
                This creates a direct supervision link. The student and supervisor will be notified.
                The supervisor will immediately gain access to the student's topics, scans, and messages.
            </div>
        `;

        window.openModal({
            title: 'Create a new pairing',
            body,
            actions: [
                { label: 'Cancel', variant: 'secondary', value: false },
                {
                    label: 'Create pairing',
                    variant: 'primary',
                    onClick: async () => {
                        const supEl = body.querySelector('#modalSup');
                        const stuEl = body.querySelector('#modalStu');
                        const supId = supEl.value;
                        const stuId = stuEl.value;

                        if (!supId || !stuId) {
                            window.toast('Please select both a supervisor and a student.', 'warning');
                            return;
                        }
                        if (supId === stuId) {
                            window.toast('A user cannot supervise themselves.', 'warning');
                            return;
                        }

                        const exists = state.pairings.some(p =>
                            p.supervisor?.id === supId && p.student?.id === stuId
                        );
                        if (exists) {
                            window.toast('That pair already exists.', 'warning');
                            return;
                        }

                        try {
                            await window.api('/api/admin/pairings', {
                                method: 'POST',
                                body: { supervisor_id: supId, student_id: stuId }
                            });
                            window.toast('Pairing created.', 'success');
                            await load();
                        } catch (err) {
                            console.error(err);
                            window.toast(err.message || 'Could not create pairing.', 'error');
                        }
                    }
                }
            ]
        });
    }

    function errorState(msg) {
        return `
            <div class="empty">
                <div class="empty-icon" style="color: var(--iv-danger); background: var(--iv-danger-bg);">
                    <i class="fas fa-triangle-exclamation"></i>
                </div>
                <div class="empty-title">Could not load pairings</div>
                <div class="empty-text">${window.escapeHTML(msg || 'Please try again.')}</div>
                <button class="iv-btn iv-btn-primary" id="retryBtn" style="margin-top: var(--iv-s-4);">
                    <i class="fas fa-rotate-right"></i> Retry
                </button>
            </div>
        `;
    }
</script>

</body>
</html>
