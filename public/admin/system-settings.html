<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Settings — IntelliVerify Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/core.js"></script>

    <style>
        .settings-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: var(--iv-s-5);
            align-items: start;
        }

        /* ---- Section card ---- */
        .s-card {
            background: var(--iv-bg);
            border: 1px solid var(--iv-border);
            border-radius: var(--iv-r-lg);
            margin-bottom: var(--iv-s-4);
            overflow: hidden;
        }

        .s-card-head {
            padding: var(--iv-s-4) var(--iv-s-5);
            border-bottom: 1px solid var(--iv-border);
            background: var(--iv-bg-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--iv-s-3);
        }

        .s-card-title {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--iv-text);
            letter-spacing: -0.01em;
        }

        .s-card-sub {
            font-size: 12px;
            color: var(--iv-text-3);
            margin-top: 2px;
        }

        .s-card-body { padding: var(--iv-s-5); }

        /* ---- Threshold display ---- */
        .threshold-row {
            display: flex;
            align-items: center;
            gap: var(--iv-s-4);
            padding: var(--iv-s-4) 0;
            border-bottom: 1px solid var(--iv-border);
        }

        .threshold-row:last-child { border-bottom: none; padding-bottom: 0; }
        .threshold-row:first-child { padding-top: 0; }

        .threshold-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .dot-success { background: var(--iv-success); }
        .dot-warning { background: var(--iv-warning); }
        .dot-danger  { background: var(--iv-danger); }

        .threshold-body { flex: 1; min-width: 0; }

        .threshold-name {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--iv-text);
        }

        .threshold-text {
            font-size: 12.5px;
            color: var(--iv-text-3);
            margin-top: 2px;
            line-height: 1.5;
        }

        .threshold-value {
            font-family: var(--iv-font-mono);
            font-size: 14px;
            font-weight: 700;
            color: var(--iv-text);
            flex-shrink: 0;
            padding: 4px 10px;
            border-radius: var(--iv-r-sm);
            background: var(--iv-bg-muted);
        }

        /* ---- Info note ---- */
        .info-note {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: var(--iv-s-3) var(--iv-s-4);
            border-radius: var(--iv-r-sm);
            font-size: 12.5px;
            line-height: 1.55;
            margin-top: var(--iv-s-4);
        }

        .info-note-info {
            background: var(--iv-info-bg);
            border: 1px solid var(--iv-info-border);
            color: var(--iv-text-2);
        }

        .info-note-info i { color: var(--iv-info); margin-top: 2px; flex-shrink: 0; }

        /* ---- Stat grid ---- */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--iv-s-3);
        }

        .stat-mini {
            padding: var(--iv-s-4);
            background: var(--iv-bg-subtle);
            border: 1px solid var(--iv-border);
            border-radius: var(--iv-r-sm);
        }

        .stat-mini-label {
            font-size: 11px;
            color: var(--iv-text-3);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 500;
        }

        .stat-mini-value {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--iv-text);
            margin-top: 5px;
            line-height: 1;
        }

        .stat-mini-sub {
            font-size: 11.5px;
            color: var(--iv-text-3);
            margin-top: 4px;
        }

        /* ---- Risk distribution bars ---- */
        .dist-bar {
            display: flex;
            height: 10px;
            border-radius: 6px;
            overflow: hidden;
            background: var(--iv-bg-muted);
            margin-bottom: var(--iv-s-4);
        }

        .dist-seg {
            height: 100%;
            transition: var(--iv-transition);
        }

        .dist-seg-low    { background: var(--iv-success); }
        .dist-seg-medium { background: var(--iv-warning); }
        .dist-seg-high   { background: var(--iv-danger); }

        .dist-legend {
            display: flex;
            gap: var(--iv-s-5);
            flex-wrap: wrap;
        }

        .dist-legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .dist-legend-color {
            width: 10px; height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .dist-legend-label { color: var(--iv-text-2); }
        .dist-legend-value {
            color: var(--iv-text);
            font-weight: 600;
            font-family: var(--iv-font-mono);
        }

        /* ---- Data table (read-only) ---- */
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--iv-s-3);
            padding: var(--iv-s-3) 0;
            border-bottom: 1px solid var(--iv-border);
            font-size: 13px;
        }

        .data-row:last-child { border-bottom: none; padding-bottom: 0; }
        .data-row:first-child { padding-top: 0; }

        .data-label { color: var(--iv-text-3); }
        .data-value {
            color: var(--iv-text);
            font-weight: 600;
        }
        .data-value-mono {
            font-family: var(--iv-font-mono);
            font-size: 12.5px;
        }

        /* ---- Export button ---- */
        .export-btn {
            width: 100%;
            height: 44px;
            padding: 0 var(--iv-s-4);
            border-radius: var(--iv-r-sm);
            background: var(--iv-accent);
            color: var(--iv-text-inverse);
            border: none;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--iv-transition);
            margin-top: var(--iv-s-4);
        }

        .export-btn:hover:not(:disabled) { background: var(--iv-accent-hover); }
        .export-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ---- Aside ---- */
        .aside {
            background: var(--iv-bg-subtle);
            border: 1px solid var(--iv-border);
            border-radius: var(--iv-r-lg);
            padding: var(--iv-s-5);
            position: sticky;
            top: calc(var(--iv-topbar-h) + var(--iv-s-4));
        }

        .aside-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--iv-text-3);
            margin-bottom: var(--iv-s-4);
        }

        .aside-section {
            padding-bottom: var(--iv-s-4);
            margin-bottom: var(--iv-s-4);
            border-bottom: 1px solid var(--iv-border);
        }

        .aside-section:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        .aside-heading {
            font-size: 13px;
            font-weight: 600;
            color: var(--iv-text);
            margin-bottom: var(--iv-s-3);
        }

        .aside-text {
            font-size: 12.5px;
            color: var(--iv-text-3);
            line-height: 1.55;
        }

        /* ---- Skeleton ---- */
        .sk {
            background: linear-gradient(90deg, #f4f4f5 0%, #e4e4e7 50%, #f4f4f5 100%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 6px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ---- Responsive ---- */
        @media (max-width: 1000px) {
            .settings-layout { grid-template-columns: 1fr; }
            .aside { position: static; order: -1; }
        }

        @media (max-width: 600px) {
            .s-card-body { padding: var(--iv-s-4); }
            .stat-grid { grid-template-columns: 1fr; }
            .threshold-value { font-size: 12.5px; padding: 3px 8px; }
        }
    </style>
</head>
<body>

<div id="iv-shell"></div>

<script>
    // These match the hardcoded values in services/plagiarism.js.
    // If you change the engine, update these too, or the page will be misleading.
    const THRESHOLDS = {
        lowMax: 30,       // 0–30 → low
        mediumMax: 60,    // 31–60 → medium
        // 61–100 → high
        cosineWeight: 0.7,
        jaccardWeight: 0.3,
        ngramSize: 3,
        minWords: 30
    };

    const state = {
        stats: null,
        reports: [],
        corpus: [],
        topics: [],
        users: []
    };

    (async () => {
        const ctx = await window.requireRole('admin');
        if (!ctx) return;

        const content = await window.renderShell({
            ctx,
            activePath: '/admin/system-settings.html',
            title: 'System Settings',
            subtitle: 'Configuration, statistics, and diagnostic export',
            actions: `
                <a href="/admin/dashboard.html" class="iv-btn iv-btn-secondary iv-btn-sm">
                    <i class="fas fa-arrow-left"></i> Dashboard
                </a>
            `
        });

        content.innerHTML = skeleton();
        await load();
    })();

    // ============================================================
    // LOAD
    // ============================================================

    async function load() {
        const content = document.getElementById('iv-content');
        try {
            const [statsRes, reportsRes, corpusRes, topicsRes, usersRes] = await Promise.all([
                window.api('/api/admin/stats').catch(() => null),
                window.api('/api/reports').catch(() => ({ reports: [] })),
                window.api('/api/corpus').catch(() => ({ documents: [] })),
                window.api('/api/topics').catch(() => ({ topics: [] })),
                window.api('/api/admin/users').catch(() => ({ users: [] }))
            ]);

            state.stats = statsRes || null;
            state.reports = reportsRes.reports || [];
            state.corpus = corpusRes.documents || [];
            state.topics = topicsRes.topics || [];
            state.users = usersRes.users || [];

            content.innerHTML = page();
            wireExport();
        } catch (err) {
            console.error(err);
            content.innerHTML = errorState(err.message);
            const retry = document.getElementById('retryBtn');
            if (retry) retry.onclick = load;
        }
    }

    // ============================================================
    // SKELETON
    // ============================================================

    function skeleton() {
        return `
            <div class="settings-layout">
                <div>
                    ${[1,2,3].map(() => `
                        <div class="s-card">
                            <div class="s-card-head">
                                <div class="sk" style="height: 14px; width: 160px;"></div>
                            </div>
                            <div class="s-card-body">
                                <div class="sk" style="height: 60px; width: 100%;"></div>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div class="aside">
                    <div class="sk" style="height: 200px; width: 100%;"></div>
                </div>
            </div>
        `;
    }

    // ============================================================
    // PAGE
    // ============================================================

    function page() {
        return `
            <div class="settings-layout">
                <div>
                    ${thresholdsCard()}
                    ${statsCard()}
                    ${riskDistributionCard()}
                    ${corpusCard()}
                </div>

                ${aside()}
            </div>
        `;
    }

    // ============================================================
    // THRESHOLDS
    // ============================================================

    function thresholdsCard() {
        return `
            <div class="s-card">
                <div class="s-card-head">
                    <div>
                        <div class="s-card-title">Plagiarism classification thresholds</div>
                        <div class="s-card-sub">The boundaries the engine uses to label scan results</div>
                    </div>
                </div>
                <div class="s-card-body">
                    <div class="threshold-row">
                        <div class="threshold-dot dot-success"></div>
                        <div class="threshold-body">
                            <div class="threshold-name">Low risk</div>
                            <div class="threshold-text">
                                A submission is considered unique. It can be attached to a topic proposal.
                            </div>
                        </div>
                        <div class="threshold-value">0 – ${THRESHOLDS.lowMax}%</div>
                    </div>

                    <div class="threshold-row">
                        <div class="threshold-dot dot-warning"></div>
                        <div class="threshold-body">
                            <div class="threshold-name">Medium risk</div>
                            <div class="threshold-text">
                                Moderate overlap detected. Cannot be attached to a topic —
                                the student must revise and rescan.
                            </div>
                        </div>
                        <div class="threshold-value">${THRESHOLDS.lowMax + 1} – ${THRESHOLDS.mediumMax}%</div>
                    </div>

                    <div class="threshold-row">
                        <div class="threshold-dot dot-danger"></div>
                        <div class="threshold-body">
                            <div class="threshold-name">High risk</div>
                            <div class="threshold-text">
                                Substantial textual overlap. Requires rewriting and proper citation
                                before submission.
                            </div>
                        </div>
                        <div class="threshold-value">${THRESHOLDS.mediumMax + 1} – 100%</div>
                    </div>

                    <div class="info-note info-note-info">
                        <i class="fas fa-info-circle"></i>
                        <div>
                            These thresholds are defined in the plagiarism engine's configuration
                            (<code style="font-family: var(--iv-font-mono); font-size: 11.5px;">services/plagiarism.js</code>).
                            Editable thresholds are on the roadmap — they require a persistent
                            settings table and a runtime config loader.
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    // ============================================================
    // STATS
    // ============================================================

    function statsCard() {
        const s = state.stats || {};
        const users = s.users || {};
        const topics = s.topics || {};
        const reports = s.reports || {};

        return `
            <div class="s-card">
                <div class="s-card-head">
                    <div>
                        <div class="s-card-title">System statistics</div>
                        <div class="s-card-sub">Live counts across the entire platform</div>
                    </div>
                </div>
                <div class="s-card-body">
                    <div class="stat-grid">
                        <div class="stat-mini">
                            <div class="stat-mini-label">Users</div>
                            <div class="stat-mini-value">${Number(users.total || 0)}</div>
                            <div class="stat-mini-sub">
                                ${users.students || 0} students ·
                                ${users.supervisors || 0} supervisors ·
                                ${users.admins || 0} admins
                            </div>
                        </div>
                        <div class="stat-mini">
                            <div class="stat-mini-label">Topics</div>
                            <div class="stat-mini-value">${Number(topics.total || 0)}</div>
                            <div class="stat-mini-sub">
                                ${topics.pending || 0} pending
                            </div>
                        </div>
                        <div class="stat-mini">
                            <div class="stat-mini-label">Scans run</div>
                            <div class="stat-mini-value">${Number(reports.total || 0)}</div>
                            <div class="stat-mini-sub">
                                ${reports.high_risk || 0} high-risk
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    // ============================================================
    // RISK DISTRIBUTION
    // ============================================================

    function riskDistributionCard() {
        const counts = { low: 0, medium: 0, high: 0 };
        state.reports.forEach(r => {
            const k = String(r.risk_level || 'low').toLowerCase();
            if (counts[k] !== undefined) counts[k]++;
        });
        const total = counts.low + counts.medium + counts.high;

        const pct = (n) => total === 0 ? 0 : (n / total) * 100;

        return `
            <div class="s-card">
                <div class="s-card-head">
                    <div>
                        <div class="s-card-title">Risk distribution</div>
                        <div class="s-card-sub">
                            ${total === 0
                                ? 'No scans recorded yet'
                                : `Across all ${total} plagiarism scan${total === 1 ? '' : 's'}`}
                        </div>
                    </div>
                </div>
                <div class="s-card-body">
                    <div class="dist-bar">
                        ${total > 0 ? `
                            <div class="dist-seg dist-seg-low"    style="width: ${pct(counts.low)}%;"></div>
                            <div class="dist-seg dist-seg-medium" style="width: ${pct(counts.medium)}%;"></div>
                            <div class="dist-seg dist-seg-high"   style="width: ${pct(counts.high)}%;"></div>
                        ` : ''}
                    </div>

                    <div class="dist-legend">
                        <div class="dist-legend-item">
                            <div class="dist-legend-color" style="background: var(--iv-success);"></div>
                            <span class="dist-legend-label">Low</span>
                            <span class="dist-legend-value">${counts.low}</span>
                        </div>
                        <div class="dist-legend-item">
                            <div class="dist-legend-color" style="background: var(--iv-warning);"></div>
                            <span class="dist-legend-label">Medium</span>
                            <span class="dist-legend-value">${counts.medium}</span>
                        </div>
                        <div class="dist-legend-item">
                            <div class="dist-legend-color" style="background: var(--iv-danger);"></div>
                            <span class="dist-legend-label">High</span>
                            <span class="dist-legend-value">${counts.high}</span>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    // ============================================================
    // CORPUS STATS
    // ============================================================

    function corpusCard() {
        const docs = state.corpus;
        const totalDocs = docs.length;
        const totalWords = docs.reduce((sum, d) => sum + (d.word_count || 0), 0);
        const avgWords = totalDocs ? Math.round(totalWords / totalDocs) : 0;

        return `
            <div class="s-card">
                <div class="s-card-head">
                    <div>
                        <div class="s-card-title">Reference corpus</div>
                        <div class="s-card-sub">Documents used for plagiarism comparison</div>
                    </div>
                </div>
                <div class="s-card-body">
                    <div class="data-row">
                        <span class="data-label">Documents in corpus</span>
                        <span class="data-value">${totalDocs}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Total words indexed</span>
                        <span class="data-value data-value-mono">${totalWords.toLocaleString()}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Average words per document</span>
                        <span class="data-value data-value-mono">${avgWords.toLocaleString()}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Storage bucket</span>
                        <span class="data-value data-value-mono">corpus</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Visibility</span>
                        <span class="data-value">
                            <span class="iv-badge iv-badge-neutral">Private</span>
                        </span>
                    </div>
                </div>
            </div>
        `;
    }

    // ============================================================
    // ASIDE
    // ============================================================

    function aside() {
        return `
            <aside class="aside">
                <div class="aside-title">System info</div>

                <div class="aside-section">
                    <div class="aside-heading">Configuration</div>
                    <div class="aside-text">
                        Cosine weight: <strong>${THRESHOLDS.cosineWeight}</strong><br>
                        Jaccard weight: <strong>${THRESHOLDS.jaccardWeight}</strong><br>
                        N-gram size: <strong>${THRESHOLDS.ngramSize}</strong> words<br>
                        Min. words for scan: <strong>${THRESHOLDS.minWords}</strong>
                    </div>
                </div>

                <div class="aside-section">
                    <div class="aside-heading">Backend</div>
                    <div class="aside-text">
                        Node.js + Express<br>
                        Supabase Postgres + Auth<br>
                        Deployed on Render
                    </div>
                </div>

                <div class="aside-section">
                    <div class="aside-heading">Export</div>
                    <div class="aside-text">
                        Download a JSON snapshot of the current system state —
                        useful for your defense documentation or for archival.
                    </div>
                    <button class="export-btn" id="exportBtn">
                        <i class="fas fa-download"></i>
                        Download system report
                    </button>
                </div>
            </aside>
        `;
    }

    // ============================================================
    // EXPORT
    // ============================================================

    function wireExport() {
        const btn = document.getElementById('exportBtn');
        if (!btn) return;

        btn.onclick = () => {
            const now = new Date();
            const filename = 'intelliverify-system-report-' +
                now.toISOString().slice(0, 10) + '.json';

            const report = {
                generated_at: now.toISOString(),
                application: {
                    name: 'IntelliVerify',
                    version: '3.0.0',
                    description: 'Final Year Project Topic Approval & Plagiarism Detection System'
                },
                engine_config: THRESHOLDS,
                statistics: {
                    users: state.stats?.users || {},
                    topics: state.stats?.topics || {},
                    reports: state.stats?.reports || {}
                },
                corpus: {
                    document_count: state.corpus.length,
                    total_words: state.corpus.reduce((sum, d) => sum + (d.word_count || 0), 0),
                    documents: state.corpus.map(d => ({
                        id: d.id,
                        filename: d.filename,
                        format: d.file_format,
                        size_bytes: d.file_size,
                        word_count: d.word_count,
                        uploaded_by: d.uploader?.email || null,
                        created_at: d.created_at
                    }))
                },
                risk_distribution: computeRiskDist(),
                recent_topics: state.topics.slice(0, 20).map(t => ({
                    id: t.topic_id,
                    title: t.title,
                    status: t.status,
                    student: t.student?.email || null,
                    submitted_at: t.submitted_at
                }))
            };

            try {
                const blob = new Blob(
                    [JSON.stringify(report, null, 2)],
                    { type: 'application/json' }
                );
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);

                window.toast('Report downloaded.', 'success');
            } catch (err) {
                console.error(err);
                window.toast('Could not generate report.', 'error');
            }
        };
    }

    function computeRiskDist() {
        const counts = { low: 0, medium: 0, high: 0 };
        state.reports.forEach(r => {
            const k = String(r.risk_level || 'low').toLowerCase();
            if (counts[k] !== undefined) counts[k]++;
        });
        return counts;
    }

    // ============================================================
    // ERROR
    // ============================================================

    function errorState(msg) {
        return `
            <div class="s-card" style="text-align: center; padding: var(--iv-s-10) var(--iv-s-5);">
                <div style="font-size: 24px; color: var(--iv-danger); margin-bottom: var(--iv-s-3);">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <div style="font-size: 15px; font-weight: 600; color: var(--iv-text); margin-bottom: var(--iv-s-2);">
                    Could not load settings
                </div>
                <div style="font-size: 13.5px; color: var(--iv-text-3); margin-bottom: var(--iv-s-5);">
                    ${window.escapeHTML(msg || 'Please try again.')}
                </div>
                <button class="iv-btn iv-btn-primary" id="retryBtn">
                    <i class="fas fa-sync-alt"></i> Retry
                </button>
            </div>
        `;
    }
</script>

</body>
  </html>
